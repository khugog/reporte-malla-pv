name: Distribuir Segmentaciones de Cursalab

on:
  # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

  # Revisa la carpeta compartida "archivos cursalab" cada 15 minutos y reparte
  # cada Segmentación a la malla que le corresponde (Makro, PlazaVea, Oslo, Merkao)
  # ANTES de que corran los reportes de cada marca (que se ejecutan a las 18:00 UTC).
  schedule:
    - cron: '*/15 * * * *'

jobs:
  distribuir:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Repartir archivos de Cursalab a cada malla
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        GDRIVE_CURSALAB_FOLDER_ID: ${{ secrets.GDRIVE_CURSALAB_FOLDER_ID }}
        GDRIVE_INPUT_FOLDER_ID: ${{ secrets.GDRIVE_INPUT_FOLDER_ID }}
        GDRIVE_INPUT_FOLDER_ID_PLAZAVEA: ${{ secrets.GDRIVE_INPUT_FOLDER_ID_PLAZAVEA }}
        GDRIVE_INPUT_FOLDER_ID_OSLO: ${{ secrets.GDRIVE_INPUT_FOLDER_ID_OSLO }}
        GDRIVE_INPUT_FOLDER_ID_MERKAO: ${{ secrets.GDRIVE_INPUT_FOLDER_ID_MERKAO }}
      run: |
        python distribuir_segmentaciones.py
