name: Ejecutar Reporte Malla Automatizado

on:
  # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

  # Ejecución programada (todos los días a las 6:00 AM UTC / 1:00 AM hora de Perú)
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Procesamiento de Reporte
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        GDRIVE_INPUT_FOLDER_ID: ${{ secrets.GDRIVE_INPUT_FOLDER_ID }}
        GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
      run: |
        python procesar_drive.py
