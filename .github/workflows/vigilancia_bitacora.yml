name: Vigilancia de Inputs (Bitacora)

on:
  # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

  # Ejecución programada cada 15 minutos
  schedule:
    - cron: '*/15 * * * *'

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth

    - name: Registrar estado de Inputs en la bitacora
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        GDRIVE_INPUT_FOLDER_ID: ${{ secrets.GDRIVE_INPUT_FOLDER_ID }}
      run: |
        python vigilancia_bitacora.py
